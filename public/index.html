<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="免费、准确、可复制结果的 VPS 服务器剩余价值计算器">
  <meta name="theme-color" content="#f6f8fb">
  <title>Worth · VPS 剩余价值计算器</title>
  <script>try{const t=localStorage.getItem('worth-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="Worth 首页">
        <span class="brand-icon">W</span><span>Worth</span><small>beta</small>
      </a>
      <nav aria-label="主导航">
        <a class="active" href="#calculator">🔥 价值计算</a>
        <a href="https://github.com/timewoder/worth" target="_blank" rel="noopener">GitHub</a>
        <label class="theme-picker" aria-label="外观模式">
          <select id="themeMode">
            <option value="system">跟随系统</option>
            <option value="light">浅色</option>
            <option value="dark">深色</option>
          </select>
        </label>
      </nav>
    </div>
  </header>

  <main id="calculator">
    <section class="hero">
      <div class="title-line">
        <h1>VPS 剩余价值计算器</h1>
        <span class="rate-badge" id="rateBadge">1 USD = -- CNY</span>
      </div>
      <p>精准计算您的 VPS 服务剩余价值，让每一笔服务器交易都有据可循</p>
    </section>

    <section class="calculator-grid">
      <article class="card form-card">
        <div class="card-heading">
          <div>
            <h2><span class="heading-icon">¥</span>服务器信息</h2>
            <p>请填写您的 VPS 服务器相关信息</p>
          </div>
          <label class="auto-switch" title="开启后修改内容将自动计算">
            <span>自动</span>
            <input id="autoCalculate" type="checkbox" checked>
            <i aria-hidden="true"></i>
          </label>
        </div>

        <form id="valueForm" novalidate>
          <div class="form-grid">
            <label class="field">
              <span>续费金额 <b>*</b></span>
              <input id="renewalPrice" type="number" min="0.01" max="99999999" step="0.01" inputmode="decimal" placeholder="请输入续费金额" required>
            </label>
            <label class="field">
              <span>货币种类 <b>*</b></span>
              <select id="currency" required>
                <option value="USD">美元 (USD)</option>
                <option value="CNY">人民币 (CNY)</option>
                <option value="EUR">欧元 (EUR)</option>
                <option value="GBP">英镑 (GBP)</option>
                <option value="JPY">日元 (JPY)</option>
                <option value="KRW">韩元 (KRW)</option>
                <option value="AUD">澳元 (AUD)</option>
                <option value="CAD">加元 (CAD)</option>
                <option value="SGD">新加坡元 (SGD)</option>
                <option value="HKD">港币 (HKD)</option>
              </select>
            </label>
            <label class="field full">
              <span>付款周期</span>
              <select id="paymentCycle">
                <option value="30">月付</option>
                <option value="90">季付</option>
                <option value="180">半年付</option>
                <option value="365">年付</option>
                <option value="730">两年付</option>
                <option value="1095">三年付</option>
              </select>
            </label>
            <label class="field">
              <span>到期日期 <b>*</b></span>
              <input id="expirationDate" type="date" required>
            </label>
            <label class="field">
              <span>交易日期 <b>*</b></span>
              <input id="transactionDate" type="date" required>
            </label>
          </div>
          <p class="form-error" id="formError" role="alert"></p>
          <button class="primary-button" type="submit">
            <span aria-hidden="true">▦</span>计算剩余价值
          </button>
        </form>
      </article>

      <article class="card result-card" aria-live="polite">
        <div class="card-heading">
          <div>
            <h2><span class="heading-icon chart">↗</span>计算结果</h2>
            <p>您的 VPS 服务剩余价值详情</p>
          </div>
        </div>

        <div class="empty-result" id="emptyResult">
          <div class="calculator-symbol" aria-hidden="true">▦</div>
          <p>请填写左侧信息并点击计算</p>
        </div>

        <div class="result-content" id="resultContent" hidden>
          <div class="date-summary">
            <div><span>交易日期</span><strong id="resultTransaction">--</strong></div>
            <div><span>到期日期</span><strong id="resultExpiration">--</strong></div>
          </div>
          <div class="value-highlight">
            <span>剩余价值</span>
            <strong>¥ <span id="remainingValue">0.00</span></strong>
            <small>总价值 ¥ <span id="totalValue">0.00</span></small>
          </div>
          <div class="result-stats">
            <div><span class="pink">剩余天数</span><strong id="remainingDays">0 天</strong></div>
            <div><span class="blue">续费金额</span><strong id="renewalSummary">--</strong></div>
            <div><span class="green">外币汇率</span><strong id="rateSummary">--</strong></div>
          </div>
          <button class="copy-button" id="copyResult" type="button">复制 Markdown 格式结果</button>
        </div>
      </article>
    </section>
  </main>

  <footer>
    <div><strong>Worth</strong><span>简单、准确的服务器价值工具</span></div>
    <a href="https://github.com/timewoder/worth" target="_blank" rel="noopener">Open source on GitHub</a>
  </footer>
  <div class="toast" id="toast" role="status"></div>
  <script src="/app.js" defer></script>
</body>
</html>
